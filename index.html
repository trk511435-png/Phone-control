<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الكويست</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .view { display: none; width: 100vw; height: 100vh; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .active { display: flex; }
        
        /* شاشة الكود */
        .pairing-box { background: #1e1e1e; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .code-display { font-size: 48px; letter-spacing: 8px; color: #03dac6; margin: 20px 0; font-weight: bold; background: #000; padding: 10px 20px; border-radius: 8px; }
        
        /* شاشة التلفون الرئيسية */
        .screen-container { width: 80%; height: 75vh; background: #000; border: 2px solid #6200ee; border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* زر الإعدادات تحت يسار */
        .settings-btn { position: absolute; bottom: 20px; left: 20px; background: #6200ee; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .settings-btn:hover { background: #7c4dff; }

        /* نافذة الإعدادات المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 400px; text-align: right; }
        select, .close-btn { width: 100%; padding: 10px; margin-top: 10px; background: #333; color: white; border: none; border-radius: 5px; font-size: 16px; }
        .close-btn { background: #cf6679; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الواجهة الأولى: كود الربط -->
    <div id="pairingView" class="view active">
        <div class="pairing-box">
            <h2>رمز الربط مع الجوال</h2>
            <p>أدخل هذا الرمز في تطبيق الجوال للبدء</p>
            <div class="code-display" id="pairingCode">------</div>
            <button onclick="simulatePairing()" style="padding: 10px 20px; background: #03dac6; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">محاكاة نجاح الربط</button>
        </div>
    </div>

    <!-- الواجهة الرئيسية: شاشة التلفون وزر الإعدادات -->
    <div id="mainView" class="view">
        <div class="screen-container">
            <h3 style="color: #888;">بث شاشة الجوال المباشر هنا</h3>
            <!-- زر الإعدادات في التحت يسار -->
            <button class="settings-btn" onclick="toggleSettings(true)">⚙️ الإعدادات</button>
        </div>
    </div>

    <!-- نافذة إعدادات الأزرار -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>تخصيص أزرار الكويست</h3>
            <label>القير اليمين (يسار/يمين):</label>
            <select id="stickRight">
                <option value="scroll">تمرير الشاشة (Scroll)</option>
                <option value="volume">رفع/خفض الصوت</option>
            </select>
            
            <label style="margin-top: 15px; display: block;">زر A:</label>
            <select id="btnA">
                <option value="click">نقرة (Click)</option>
                <option value="back">رجوع (Back)</option>
            </select>

            <button class="close-btn" onclick="toggleSettings(false)">حفظ وإغلاق</button>
        </div>
    </div>

    <script>
        // توليد كود عشوائي من 6 أرقام عند فتح الصفحة
        function generateCode() {
            const code = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('pairingCode').innerText = code;
        }
        generateCode();

        // الانتقال للشاشة الرئيسية بعد الربط (مؤقتاً بالضغط على الزر للتجربة)
        function simulatePairing() {
            document.getElementById('pairingView').classList.remove('active');
            document.getElementById('mainView').classList.add('active');
        }

        // فتح وإغلاق نافذة الإعدادات
        function toggleSettings(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
        }

        // رصد وحدات التحكم للكويست
        window.addEventListener("gamepadconnected", (e) => {
            console.log("تم توصيل يد التحكم:", e.gamepad.id);
        });
    </script>
</body>
</html>
